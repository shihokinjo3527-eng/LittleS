<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完了画面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="icon" href="picture/icon.svg">
</head>
<body>
   <header class="header">
        <h1 class="header__title">Little S</h1>
        <nav class="header__nav">
            <ul class="header__list">
                <li class="header__item"><a href="index.html">Home</a></li>
                <li class="header__item"><a href="index.html#about">About</a></li>
                <li class="header__item"><a href="index.html#product">Product</a></li>
                <li class="header__item"><a href="index.html#shopping guide">Shopping Guide</a></li>
                <li class="header__item"><a href="index.html#FAQ">FAQ</a></li>
            </ul>
        </nav>
    </header>
    <main class="cart">
        <h2 class="cart__title">カート</h2>
        <div class="cart__flex">
            <div class="cart__inner">
                 <img id="productImage" alt="カートに入れた商品の写真" style="max-width: 300px;" src="">
            </div>
            <div class="cart__total">
                <p class="total__p">商品名: <span id="productName"></span></p>
                <p class="total__p">単価：￥<span id="price"></span></p>
                <div class="quantity__flex">
                    <p class="total__p quantity__p">
                        数量:
                        <span id="quantity"></span>
                    </p>
                    <div class="quantity__button">
                        <button id="plusButton">+</button>
                        <button id="minusButton">-</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="total__wrapper">
            <p class="cart__total2 total__p">合計（税込）</p>
            <p class="cart__total3 total__p">￥ <span id="totalPrice"></span></p>
        </div>    
            <p class="cart__text">税込5,000円以上のご購入で送料無料</p>
        <div class="cart__button__flex">
            <p class="cart__button"><a href="index.html">お買い物を続ける</a></p>
            <p class="cart__next__button"><a href="confirm.html">情報入力へ</a></p>
        </div>
    </main>
    <footer class="footer">
        <img src="picture/logo.png" class="logo" alt="ロゴ">
        <ul class="footer__list">
                <li class="footer__item"><a href="index.html">Home</a></li>
                <li class="footer__item"><a href="index.html#about">About</a></li>
                <li class="footer__item"><a href="index.html#product">Product</a></li>
                <li class="footer__item"><a href="index.html#shopping guide">Shopping Guide</a></li>
                <li class="footer__item"><a href="index.html#FAQ">FAQ</a></li>
            </ul>
    </footer>

    <script>
        // -----------------------------------
        // 1. HTMLの要素を取得する
        // -----------------------------------
        // 画面に値を表示するために、spanタグやbuttonタグを取得しています。

        // 商品名を表示する span
        const productNameSpan = document.getElementById("productName");

        // 単価を表示する span
        const priceSpan = document.getElementById("price");

        // 数量を表示する span
        const quantitySpan = document.getElementById("quantity");

        // 合計金額を表示する span
        const totalPriceSpan = document.getElementById("totalPrice");

        // 数量を減らすボタン
        const minusButton = document.getElementById("minusButton");

        // 数量を増やすボタン
        const plusButton = document.getElementById("plusButton");


        // -----------------------------------
        // 2. localStorage に保存するときのキー名
        // -----------------------------------
        // localStorage は「キー名」と「値」のセットで保存します。
        // 今回はキー名を goodsOrder にしています。
        const STORAGE_KEY = "goodsOrder";


        // -----------------------------------
        // 3. 初回だけサンプルデータを保存する
        // -----------------------------------
        // まだ localStorage に goodsOrder がない場合だけ、
        // 最初のサンプルデータを保存します。
        //
        // すでに保存済みであれば、この処理は実行されません。
        //  if (!localStorage.getItem(STORAGE_KEY)) {
        //     const defaultProduct = {
        //         productId: "P001",
        //         productName: "ノートパソコン",
        //         price: 5000,
        //         quantity: 2
        //     };

        //     // localStorage には文字列しか保存できないので
        //     // JSON.stringify() で文字列に変換して保存します
        //     localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProduct));
        // }


        // -----------------------------------
        // 4. localStorage から商品データを取得する関数
        // -----------------------------------
        function getProductData() {
            // localStorage から goodsOrder の値を取得する
            const savedData = localStorage.getItem(STORAGE_KEY);

            // 取得したデータは文字列なので、
            // JSON.parse() を使って元のオブジェクトに戻す
            return JSON.parse(savedData);
        }


        // -----------------------------------
        // 5. localStorage に商品データを保存する関数
        // -----------------------------------
        function saveProductData(productData) {
            // JavaScriptのオブジェクトを
            // JSON文字列に変換して保存する
            localStorage.setItem(STORAGE_KEY, JSON.stringify(productData));
        }


        // -----------------------------------
        // 6. 画面表示を更新する関数
        // -----------------------------------
        function renderCart() {
            // 最新のデータを localStorage から取得する
            const productData = getProductData();

            // 商品画像を画面に表示
            document.getElementById("productImage").src = productData.image;

            // 商品名を画面に表示
            productNameSpan.textContent = productData.productName;

            // 単価を画面に表示
            priceSpan.textContent = productData.price;

            // 数量を画面に表示
            quantitySpan.textContent = productData.quantity;

            // 合計金額を計算する
            // 単価 × 数量
            const totalPrice = productData.price * productData.quantity;

            // 合計金額を画面に表示
            totalPriceSpan.textContent = totalPrice;
        }


        // -----------------------------------
        // 7. ＋ボタンを押したときの処理
        // -----------------------------------
        plusButton.addEventListener("click", function () {
            // 現在の保存データを取得する
            const productData = getProductData();

            // 数量を1増やす
            productData.quantity = productData.quantity + 1;

            // 増やしたあとのデータを localStorage に保存し直す
            saveProductData(productData);

            // 画面表示も最新状態に更新する
            renderCart();
        });


        // -----------------------------------
        // 8. －ボタンを押したときの処理
        // -----------------------------------
        minusButton.addEventListener("click", function () {
            // 現在の保存データを取得する
            const productData = getProductData();

            // 数量が1より大きいときだけ減らす
            // 1未満にならないようにするためのチェックです
            if (productData.quantity > 1) {
                // 数量を1減らす
                productData.quantity = productData.quantity - 1;

                // 減らしたあとのデータを localStorage に保存し直す
                saveProductData(productData);

                // 画面表示も最新状態に更新する
                renderCart();
            }
        });


        // -----------------------------------
        // 9. ページを開いたときに最初の表示を行う
        // -----------------------------------
        renderCart();
    </script>
</body>
</html>
