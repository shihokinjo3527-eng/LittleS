<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>確認画面</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Pinyon+Script&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    </head>

    <body>
        <header class="header">
            <div class="header__top">
                <h1 class="header__title">Little S</h1>
            </div>
            <div class="header__wrapper">
                <input type="checkbox" id="menu-toggle" hidden>
                <label class="menu-icon" for="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <div class="overlay"></div>

                <nav class="header__nav">
                    <ul class="header__list">
                        <li class="header__item"><a href="index.html">Home</a></li>
                        <li class="header__item"><a href="#about">About</a></li>
                        <li class="header__item"><a href="#product">Product</a></li>
                        <li class="header__item"><a href="#shopping__guide">Shopping Guide</a></li>
                        <li class="header__item"><a href="#faq">FAQ</a></li>
                        <li class="header__item header__cart"><a href="cart.html"><img src="picture/cart.png" alt="カート"></a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <h2 class="confirm__title">確認画面</h2>


        <!--
        JSONから読み込んだ商品IDを表示する場所
    -->
        <p class="confirm__p">商品ID: <span id="productId"></span></p>

        <!--
        JSONから読み込んだ商品名を表示する場所
    -->
        <p class="confirm__p">商品名: <span id="productName"></span></p>

        <!--
        JSONから読み込んだ価格を表示する場所
    -->
        <p class="confirm__p">価格: <span id="price"></span>円</p>

        <!--
        個数入力欄
        ユーザーが購入したい数量を入力します
    -->
        <div class="quantity">
            <label for="quantity">個数</label>
            <input type="number" id="quantity" min="1" placeholder="個数を入力">
        </div>

        <br><br>


        <form action="#" method="post" class="form__section">
            <dl class="form">
                <dt>
                    <label class="label" for="name">名前（必須）</label>
                </dt>
                <dd>
                    <input id="name" type="text" name="name" class="form__box" required>
                </dd>
                <dt>
                    <label class="post" for="post">郵便番号（必須）</label>
                </dt>
                <dd>
                    <input id="post" type="text" name="post" class="form__box" required>
                </dd>
                <dt>
                    <label class="address" for="address">住所（必須）</label>
                </dt>
                <dd>
                    <input id="address" type="text" name="address" class="form__box" required>
                </dd>
                <dt>
                    <label class="email" for="email">メールアドレス（必須）</label>
                </dt>
                <dd>
                    <input id="email" type="tel" name="email" class="form__box" required>
                </dd>
                <dt>
                    <label class="tel" for="tel">電話番号</label>
                </dt>
                <dd>
                    <input id="tel" type="text" name="tel" class="form__box" required>
                </dd>
          
                <dt>
                    <p class="radio__title">支払い方法（必須）</p>
                </dt>
                <div class="radio__pay">
                    <dd>
                        <input type="radio" id="credit" name="payment" value="credit" checked />
                        <label for="credit">クレジット</label>
                    </dd>
                    <dd>
                        <input type="radio" id="convenience" name="payment" value="convenience" />
                        <label for="convenience">コンビニ支払い</label>
                    </dd>
                    <dd>
                        <input type="radio" id="bank" name="payment" value="bank" />
                        <label for="bank">銀行振込</label>
                    </dd>
                </div>
            </dl>

        </form>

        <div class="inform">
            <p class="inform__text">商品はご注文確認後、通常1〜3営業日以内に発送いたします。<br>発送完了後、メールにてご案内いたします。</p>
        </div>

        <!--
        確認ボタン
        押したら localStorage に保存して確定画面へ移動します
    -->
            <button class="confirm__button">注文を確定する</button>

        <footer class="footer">
            <img src="picture/logo.png" class="logo" alt="ロゴ">
            <ul class="footer__list">
                    <li class="footer__item"><a href="#">Home</a></li>
                    <li class="footer__item"><a href="#about">About</a></li>
                    <li class="footer__item"><a href="#product">Product</a></li>
                    <li class="footer__item"><a href="#shopping__guide">Shopping Guide</a></li>
                    <li class="footer__item"><a href="#faq">FAQ</a></li>
                </ul>
        </footer>

        <script>
        // -----------------------------------
        // 1. HTMLの要素を取得する
        // -----------------------------------
        // 画面に値を表示するために、spanタグやbuttonタグを取得しています。

        // 商品IDを表示する span
        const productIdSpan = document.getElementById("productId");

        // 商品名を表示する span
        const productNameSpan = document.getElementById("productName");

        // 単価を表示する span
        const priceSpan = document.getElementById("price");

        // 数量を表示する span
        const quantitySpan = document.getElementById("quantity");

        // 合計金額を表示する span
        const totalPriceSpan = document.getElementById("totalPrice");

        // 数量を減らすボタン
        const minusButton = document.getElementById("minusButton");

        // 数量を増やすボタン
        const plusButton = document.getElementById("plusButton");


        // -----------------------------------
        // 2. localStorage に保存するときのキー名
        // -----------------------------------
        // localStorage は「キー名」と「値」のセットで保存します。
        // 今回はキー名を goodsOrder にしています。
        const STORAGE_KEY = "goodsOrder";


        // -----------------------------------
        // 3. 初回だけサンプルデータを保存する
        // -----------------------------------
        // まだ localStorage に goodsOrder がない場合だけ、
        // 最初のサンプルデータを保存します。
        //
        // すでに保存済みであれば、この処理は実行されません。
        if (!localStorage.getItem(STORAGE_KEY)) {
            const defaultProduct = {
                productId: "P001",
                productName: "ノートパソコン",
                price: 5000,
                quantity: 2
            };

            // localStorage には文字列しか保存できないので
            // JSON.stringify() で文字列に変換して保存します
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProduct));
        }


        // -----------------------------------
        // 4. localStorage から商品データを取得する関数
        // -----------------------------------
        function getProductData() {
            // localStorage から goodsOrder の値を取得する
            const savedData = localStorage.getItem(STORAGE_KEY);

            // 取得したデータは文字列なので、
            // JSON.parse() を使って元のオブジェクトに戻す
            return JSON.parse(savedData);
        }


        // -----------------------------------
        // 5. localStorage に商品データを保存する関数
        // -----------------------------------
        function saveProductData(productData) {
            // JavaScriptのオブジェクトを
            // JSON文字列に変換して保存する
            localStorage.setItem(STORAGE_KEY, JSON.stringify(productData));
        }


        // -----------------------------------
        // 6. 画面表示を更新する関数
        // -----------------------------------
        function renderCart() {
            // 最新のデータを localStorage から取得する
            const productData = getProductData();

            // 商品IDを画面に表示
            productIdSpan.textContent = productData.productId;

            // 商品名を画面に表示
            productNameSpan.textContent = productData.productName;

            // 単価を画面に表示
            priceSpan.textContent = productData.price;

            // 数量を画面に表示
            quantitySpan.textContent = productData.quantity;

            // 合計金額を計算する
            // 単価 × 数量
            const totalPrice = productData.price * productData.quantity;

            // 合計金額を画面に表示
            totalPriceSpan.textContent = totalPrice;
        }


        // -----------------------------------
        // 7. ＋ボタンを押したときの処理
        // -----------------------------------
        plusButton.addEventListener("click", function () {
            // 現在の保存データを取得する
            const productData = getProductData();

            // 数量を1増やす
            productData.quantity = productData.quantity + 1;

            // 増やしたあとのデータを localStorage に保存し直す
            saveProductData(productData);

            // 画面表示も最新状態に更新する
            renderCart();
        });


        // -----------------------------------
        // 8. －ボタンを押したときの処理
        // -----------------------------------
        minusButton.addEventListener("click", function () {
            // 現在の保存データを取得する
            const productData = getProductData();

            // 数量が1より大きいときだけ減らす
            // 1未満にならないようにするためのチェックです
            if (productData.quantity > 1) {
                // 数量を1減らす
                productData.quantity = productData.quantity - 1;

                // 減らしたあとのデータを localStorage に保存し直す
                saveProductData(productData);

                // 画面表示も最新状態に更新する
                renderCart();
            }
        });


        // -----------------------------------
        // 9. ページを開いたときに最初の表示を行う
        // -----------------------------------
        renderCart();
    </script>
    </body>

</html>
