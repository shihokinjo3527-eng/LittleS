<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>確認画面</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Pinyon+Script&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    </head>

    <body>
        <header class="header">
            <div class="header__top">
                <h1 class="header__title">Little S</h1>
            </div>
            <div class="header__wrapper">
                <input type="checkbox" id="menu-toggle" hidden>
                <label class="menu-icon" for="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <div class="overlay"></div>

                <nav class="header__nav">
                    <ul class="header__list">
                        <li class="header__item"><a href="index.html">Home</a></li>
                        <li class="header__item"><a href="#about">About</a></li>
                        <li class="header__item"><a href="#product">Product</a></li>
                        <li class="header__item"><a href="#shopping__guide">Shopping Guide</a></li>
                        <li class="header__item"><a href="#faq">FAQ</a></li>
                    </ul>
                    <button class="header__cart">
                        <a href="cart.html"><img src="picture/cart.png" alt="カート">
                        </a>
                    </button>
                </nav>
            </div>
        </header>

        <h2 class="confirm__title">確認画面</h2>


        <!--
        JSONから読み込んだ商品IDを表示する場所
    -->
        <p class="confirm__p">商品ID: <span id="productId"></span></p>

        <!--
        JSONから読み込んだ商品名を表示する場所
    -->
        <p class="confirm__p">商品名: <span id="productName"></span></p>

        <!--
        JSONから読み込んだ価格を表示する場所
    -->
        <p class="confirm__p">価格: <span id="price"></span>円</p>

        <!--
        個数入力欄
        ユーザーが購入したい数量を入力します
    -->
        <div class="quantity">
            <label for="quantity">個数</label>
            <input type="number" id="quantity" min="1" placeholder="個数を入力">
        </div>

        <br><br>


        <form action="#" method="post" class="form__section">
            <dl class="form">
                <dt>
                    <label class="label" for="name">名前（必須）</label>
                </dt>
                <dd>
                    <input id="name" type="text" name="name" class="form__box">
                </dd>
                <dt>
                    <label class="post" for="number">郵便番号（必須）</label>
                </dt>
                <dd>
                    <input id="post" type="text" name="post" class="form__box">
                </dd>
                <dt>
                    <label class="address" for="address">住所（必須）</label>
                </dt>
                <dd>
                    <input id="address" type="text" name="address" class="form__box">
                </dd>
                <dt>
                    <label class="email" for="email">メールアドレス（必須）</label>
                </dt>
                <dd>
                    <input id="email" type="text" name="email" class="form__box">
                </dd>
                <dt>
                    <label class="tel" for="tel">電話番号</label>
                </dt>
                <dd>
                    <input id="tel" type="text" name="tel" class="form__box">
                </dd>
          
                <dt>
                    <p class="radio__title">支払い方法（必須）</p>
                </dt>
                <div class="radio__pay">
                    <dd>
                        <input type="radio" id="credit" name="drone" value="credit" checked />
                        <label for="credit">クレジット</label>
                    </dd>
                    <dd>
                        <input type="radio" id="convenience" name="drone" value="convenience" checked />
                        <label for="convenience">コンビニ支払い</label>
                    </dd>
                    <dd>
                        <input type="radio" id="bank" name="drone" value="bank" checked />
                        <label for="bank">銀行振込</label>
                    </dd>
                </div>
            </dl>

        </form>

        <div class="inform">
            <p class="inform__text">商品はご注文確認後、通常1〜3営業日以内に発送いたします。<br>発送完了後、メールにてご案内いたします。</p>
        </div>

        <!--
        確認ボタン
        押したら localStorage に保存して確定画面へ移動します
    -->
            <button class="confirm__button"><a href="definition.html">注文を確定する</a></button>

        <footer class="footer">
            <img src="picture/logo.png" class="logo" alt="ロゴ">
            <ul class="footer__list">
                    <li class="footer__item"><a href="#">Home</a></li>
                    <li class="footer__item"><a href="#about">About</a></li>
                    <li class="footer__item"><a href="#product">Product</a></li>
                    <li class="footer__item"><a href="#shopping__guide">Shopping Guide</a></li>
                    <li class="footer__item"><a href="#faq">FAQ</a></li>
                </ul>
        </footer>
    </body>

</html>
